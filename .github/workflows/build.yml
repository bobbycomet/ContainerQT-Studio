name: Build ContainerQT Studio

# Runs the tests, then builds the AppImage with packaging/build-appimage.sh inside an AlmaLinux 9 container
# (glibc 2.34), so the result runs on any distribution with glibc 2.34 or newer.
#
#   push to main / pull request  -> test + build, AppImage kept as a workflow artifact
#   tag v*  (e.g. v1.2.1)        -> test + build, AppImage + checksums attached to a GitHub Release
#   workflow_dispatch            -> manual run from the Actions tab

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt runtime libraries for the headless tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libnss3 libxcb-cursor0 libgl1 libfontconfig1
      - run: pip install -e '.[desktop,dev]'
      - name: pytest
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"

  appimage:
    name: AppImage (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4

      # The script builds the AlmaLinux 9 builder image, runs the build inside it, enforces the glibc 2.34
      # ceiling and smoke-tests the result. It fails the job rather than produce a broken AppImage.
      - name: Build the AppImage
        run: bash packaging/build-appimage.sh

      - name: Check the result
        run: |
          set -euo pipefail
          ls -lh dist
          f="$(ls dist/*.AppImage)"
          chmod +x "$f"
          "$f" --appimage-extract-and-run --version
          (cd dist && sha256sum *.AppImage > SHA256SUMS-${{ matrix.arch }}.txt && cat SHA256SUMS-${{ matrix.arch }}.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ContainerQT-Studio-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ContainerQT-Studio-*
          path: release
          merge-multiple: true
      - run: ls -lh release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.AppImage
            release/SHA256SUMS-*.txt
